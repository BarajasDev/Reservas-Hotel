# Configuracion de Alembic (migraciones de la base de datos).

[alembic]
# Carpeta donde viven los archivos de migracion.
script_location = alembic

# Agrega la carpeta actual al PATH de Python para poder importar "app".
prepend_sys_path = .

# Separador de rutas segun el sistema operativo.
path_separator = os

# La cadena de conexion real NO se escribe aqui.
# El archivo alembic/env.py la reemplaza con el valor de DATABASE_URL del .env.
sqlalchemy.url = postgresql://usuario:password@db:5432/base_de_datos


# ---------- Configuracion de los mensajes en consola ----------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
